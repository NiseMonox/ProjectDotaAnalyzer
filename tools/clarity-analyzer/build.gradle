plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.dotaanalyzer'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.skadistats:clarity:3.1.3'
    implementation 'com.google.code.gson:gson:2.10.1'
}

application {
    mainClass = 'com.dotaanalyzer.ReplayAnalyzer'
}

shadowJar {
    archiveBaseName.set('clarity-analyzer')
    archiveClassifier.set('')
    archiveVersion.set('')
    mergeServiceFiles()
}

jar {
    manifest {
        attributes 'Main-Class': 'com.dotaanalyzer.ReplayAnalyzer'
    }
}
