# nginx reverse proxy for the Dota 2 Match Analyzer.
#
# Install:
#   sudo cp deploy/nginx-dota-analyzer.conf /etc/nginx/sites-available/dota-analyzer
#   sudo ln -s /etc/nginx/sites-available/dota-analyzer /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run uvicorn on 127.0.0.1:8001 (edit the systemd unit) and set
# TRUST_PROXY_HEADERS=1 in .env so rate limits see real client IPs.
# certbot --nginx adds the TLS server block for you.

upstream dota_analyzer {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 80;
    server_name dota.example.com;

    # Must exceed MAX_UPLOAD_MB (default 300) plus multipart overhead.
    client_max_body_size 310m;
    client_body_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # AI coach progress stream (Server-Sent Events): no buffering, long reads.
    location ~ ^/api/match/[^/]+/ai-coach-stream/ {
        proxy_pass http://dota_analyzer;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Replay upload: stream the body to the app (it enforces size, magic
    # and rate limits) and wait for parsing (can take minutes).
    location = /api/upload {
        proxy_pass http://dota_analyzer;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Optional: keep admin endpoints off the public internet entirely
    # (they already require the X-Admin-Token header).
    # location /api/admin/ { allow 127.0.0.1; deny all; proxy_pass http://dota_analyzer; }

    location / {
        proxy_pass http://dota_analyzer;
        proxy_read_timeout 300s;  # AI coach JSON endpoint / OpenDota fetches
    }
}
